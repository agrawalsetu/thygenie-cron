# ============================================================
#  THYGENIE — Measurement + orphaned-writer catch-up (decoupled post-evening job)
#  File: .github/workflows/measurement-writers.yml
#
#  WHY THIS EXISTS
#  The nightly "Thygenie Automation" evening-pipeline runs
#  prices -> scoring -> recommend -> monitor -> brain, but it NEVER
#  calls cron_setup.php?run=daily, and a whole tail of writers is wired
#  ONLY into that run=daily branch — so they never ran nightly:
#    - measurement/accrual ledgers: lesson_ic, ic_history,
#      gate_attribution, riskadj, loop_audit  (ic_history was frozen
#      at 2026-07-23 for 8+ days; the composite-IC reweight roadmap is
#      blocked on this series accruing)
#    - book/risk maintenance: apply_rec_stance (de-stale soured BUYs),
#      degross_advisor (risk-off state), split-phantom guard
#
#  This runs them ~90 min AFTER the evening pipeline has finalized the
#  day's scores/prices/closures — decoupled from the fragile,
#  throttle-prone price/score batch loop so a flaky pipeline day can't
#  take the accrual down with it. Ordered to mirror cron_setup run=daily.
#
#  All endpoints are IDEMPOTENT (upsert keyed by as_of_date / today), so
#  a late run, a re-run, or an overlap with a manual seed is harmless.
#  Every step is best-effort (|| echo): a single curl timeout or parse
#  blip never fails the job. Timeouts are tolerated — the PHP keeps
#  running server-side past curl's wait window.
# ============================================================

name: Thygenie Measurement Writers

on:
  schedule:
    # 18:41 IST = 13:11 UTC — ~90 min after the 17:11 IST evening pipeline
    # start (pipeline runs ~12-15 min). The wide buffer absorbs GitHub
    # Actions schedule drift and the occasional slow/rerun evening.
    # Odd minute, off the hour, per the automation repo's drift convention.
    - cron: '11 13 * * *'
  # Manual trigger for testing / backfill.
  workflow_dispatch: {}

jobs:
  measurement-writers:
    runs-on: ubuntu-latest
    steps:
      # ── book/risk maintenance (run first, mirroring cron_setup order) ──

      # apply_rec_stance: re-stance the active book so a soured pick
      # (composite decayed below the buy-line) stops showing as a stale BUY.
      # Informational — no position closes here (that stays with monitor).
      - name: Rec stance (de-stale soured BUYs)
        run: |
          echo "apply_rec_stance: refresh active-rec stance..."
          curl -s --max-time 120 \
            "https://thygenie.in/equity-invest/stock_manager.php?apply_rec_stance=1&cron=1&key=${{ secrets.CRON_KEY }}" \
            | python3 -m json.tool || echo "RecStance done (timeout tolerated)"

      # split-phantom guard: nightly tripwire for UNADJUSTED corp actions
      # (a rec whose entry predates a split/bonus reads as a phantom -75%
      # "hold"). teardown_candidates flags them read-only; alert if any surface.
      - name: Split-phantom guard (unadjusted corp-action tripwire)
        run: |
          echo "split-phantom guard: scanning active book..."
          TC=$(curl -s --max-time 120 \
            "https://thygenie.in/equity-invest/teardown_candidates.php?key=${{ secrets.CRON_KEY }}" || echo '{}')
          N=$(printf '%s' "$TC" | python3 -c "import sys,json; d=json.load(sys.stdin); print(int((d.get('summary') or {}).get('active_split_phantom_suspects',0) or 0))" 2>/dev/null || echo 0)
          echo "active_split_phantom_suspects=$N"
          if [ "${N:-0}" -gt 0 ] 2>/dev/null; then
            MSG=$(printf '%s' "$TC" | python3 -c "import sys,json; d=json.load(sys.stdin); rows=(d.get('split_phantoms') or [])[:10]; print('; '.join('%s %s%% ~%s:1'%(r.get('symbol'),r.get('drawdown_pct'),r.get('split_multiple')) for r in rows))" 2>/dev/null || echo "see teardown_candidates.php")
            curl -s --max-time 30 --get \
              --data-urlencode "message=$N split-phantom suspect(s) — likely unadjusted corp actions; resolve as corporate_action: $MSG" \
              "https://thygenie.in/equity-invest/alerts.php?type=failure&step=split_phantom_guard&cron=1&key=${{ secrets.CRON_KEY }}" \
              > /dev/null && echo "alert sent for $N suspect(s)" || echo "alert attempt done"
          else
            echo "clean — no split-phantom suspects"
          fi

      # degross_advisor: advance the risk-off hysteresis state (throttle_state)
      # and emit the de-gross recommendation. SHADOW — no book writes.
      - name: De-gross advisor (advance risk-off state, shadow)
        run: |
          echo "degross_advisor: advance risk-off state (shadow)..."
          curl -s --max-time 90 \
            "https://thygenie.in/equity-invest/degross_advisor.php?cron=1&key=${{ secrets.CRON_KEY }}" \
            | python3 -m json.tool || echo "DeGross done (timeout tolerated)"

      # ── measurement / accrual ledgers ──

      # lesson_ic: forward-validated lesson efficacy (reads stock_scores_history).
      - name: Lesson IC (forward-validated lesson efficacy)
        run: |
          echo "lesson_ic: forward-validated lesson efficacy ledger..."
          curl -s --max-time 180 \
            "https://thygenie.in/equity-invest/lesson_ic.php?cron=1&key=${{ secrets.CRON_KEY }}" \
            | python3 -m json.tool || echo "LessonIC done (timeout tolerated)"

      # ic_history: per-engine forward + resolved IC snapshot -> ic_history.
      # THE primary series the reweight roadmap is blocked on.
      - name: IC history (per-engine forward + resolved IC snapshot)
        run: |
          echo "ic_history: per-engine IC snapshot..."
          curl -s --max-time 180 \
            "https://thygenie.in/equity-invest/ic_history.php?run=1&cron=1&key=${{ secrets.CRON_KEY }}" \
            | python3 -m json.tool || echo "ICHistory done (timeout tolerated)"

      # gate_attribution: per-gate realised market-neutral lift -> gate_attribution_log.
      - name: Gate attribution (per-gate realised lift snapshot)
        run: |
          echo "gate_attribution: per-gate realised lift snapshot..."
          curl -s --max-time 180 \
            "https://thygenie.in/equity-invest/gate_attribution.php?run=1&cron=1&key=${{ secrets.CRON_KEY }}" \
            | python3 -m json.tool || echo "GateAttrib done (timeout tolerated)"

      # riskadj: risk-adjusted return measurement (Sharpe/Sortino/IR) -> riskadj_metrics.
      - name: Risk-adjusted metrics (Sharpe / Sortino / IR ledger)
        run: |
          echo "riskadj: risk-adjusted metrics ledger..."
          curl -s --max-time 180 \
            "https://thygenie.in/equity-invest/riskadj.php?cron=1&key=${{ secrets.CRON_KEY }}" \
            | python3 -m json.tool || echo "RiskAdj done (timeout tolerated)"

      # loop_audit LAST: aggregates the day's outputs into the autonomous-loop
      # metric ledger (reads ic_history / riskadj written just above).
      - name: Loop audit (autonomous-loop metric ledger)
        run: |
          echo "loop_audit: autonomous-loop metric ledger..."
          curl -s --max-time 120 \
            "https://thygenie.in/equity-invest/loop_audit.php?cron=1&key=${{ secrets.CRON_KEY }}" \
            | python3 -m json.tool || echo "LoopAudit done (timeout tolerated)"
